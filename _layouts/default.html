<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      width: 100%;
      border-bottom: 2px solid #ccc;
    }
    .header-inner {
      max-width: 740px;
      margin: 0 auto;
      padding: 30px 20px 15px;
    }
    header a.site-title {
      font-size: 1.4em;
      font-weight: 600;
      color: #1a1a1a;
      text-decoration: none;
    }
    main {
      max-width: 740px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
      box-sizing: border-box;
      flex: 1;
    }
    .post-list { list-style: none; padding: 0; margin-top: 10px; }
    .post-list li { margin-bottom: 14px; }
    .post-date { color: #888; font-size: 0.9em; margin-right: 8px; }
    .post-desc { color: #444; font-size: 0.95em; display: block; margin-top: 2px; }
    a { color: #4183c4; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .post-content { margin-top: 20px; }
    .back-link { display: inline-block; margin-top: 40px; font-size: 0.9em; }
    footer {
      border-top: 1px solid #eee;
      padding: 20px;
      text-align: center;
      color: #888;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    © {{ 'now' | date: "%Y" }} {{ site.title }}
  </footer>
</body>
</html>
