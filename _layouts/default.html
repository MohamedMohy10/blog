<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      line-height: 1.6;
    }
    header {
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 30px;
    }
    header a.site-title {
      font-size: 1.3em;
      font-weight: 600;
      color: #222;
      text-decoration: none;
    }
    h1 { font-size: 1.6em; margin-bottom: 5px; }
    .tagline { color: #666; margin-top: 0; margin-bottom: 30px; }
    .post-list { list-style: none; padding: 0; }
    .post-list li { margin-bottom: 18px; }
    .post-date { color: #888; font-size: 0.9em; margin-right: 10px; }
    .post-desc { color: #555; font-size: 0.95em; }
    a { color: #0645ad; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .post-content { margin-top: 20px; }
    .back-link { display: inline-block; margin-top: 40px; font-size: 0.9em; }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </header>
  {{ content }}
</body>
</html>
